# image.tag is bumped automatically by CI on every push to main. Everything
# else here is set once. See projects-infrastructure for the platform.
image:
  repository: ghcr.io/manusmd/templify
  tag: fddda358795662907eda6d4455b56eca4e2897b6
  pullPolicy: IfNotPresent
replicas: 1
port: 3000
host: templify.projects.manu-web.de
certResolver: letsencrypt
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    memory: 512Mi
