{{- /*
  BETTER_AUTH_SECRET for the admin. Generated once on first sync and persisted
  (Helm lookup), so it's stable across redeploys without living in the repo.
*/ -}}
{{- $ns := .Release.Namespace -}}
{{- $name := "templify-auth" -}}
{{- $existing := lookup "v1" "Secret" $ns $name -}}
{{- $secret := "" -}}
{{- if $existing -}}
{{- $secret = index $existing.data "BETTER_AUTH_SECRET" | b64dec -}}
{{- else -}}
{{- $secret = randAlphaNum 48 -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
type: Opaque
stringData:
  BETTER_AUTH_SECRET: {{ $secret | quote }}
